### model
model_name_or_path: path/to/Qwen3-8B

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all



### dataset
dataset: SpaceX_train
dataset_dir: ./datasets/MT-CSD/sft_addlabel_noInstance_CUSTOM-LOSS_instruct_prompt_1_0428/SpaceX
template: qwen3
enable_thinking: false
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8
# dataloader_num_workers: 4
remove_unused_columns: false
additional_target: proj_step_1,proj_step_2,proj_step_3,proj_answer

kd_dir: "./datasets/MT-CSD/teacher_extract_two/Tesla_2/teacher_samples"

### output
output_dir: ./result_save/MT-CSD/SpaceX/qwen3_noInstance_LK-local-multi-layers-SPKD-dual-topKL_instruct_prompt_1_CFF1024_seed42/
logging_steps: 10

save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false

# report_to: none  # choices: [none, wandb, tensorboard, swanlab, mlflow]

### train
# deepspeed: /home/suojiangfeng/FQKJ/CSD/my_sft/ds_z2_config.json
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
seed: 42
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
# ddp_timeout: 180000000
# resume_from_checkpoint: null


### eval
eval_dataset: SpaceX_eval
val_size: 0
per_device_eval_batch_size: 1
eval_strategy: epoch
save_total_limit: 1              #最多只存 2 个检查点，防止硬盘再次爆炸
load_best_model_at_end: true
metric_for_best_model: eval_F1   # 监控指标从 eval_loss 改为 eval_F1 (必须与你日志打印的名称完全一致)
greater_is_better: true
predict_with_generate: true