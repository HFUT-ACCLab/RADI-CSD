### model
model_name_or_path: path/to/Qwen3-8B


### method
stage: sft
do_predict: true
# do_eval: true
finetuning_type: lora

### dataset
eval_dataset: Bitcoin_test
dataset_dir: path/to/datasets
template: qwen3
enable_thinking: false
cutoff_len: 1024
overwrite_cache: true
preprocessing_num_workers: 8 #16

# ### generate
do_sample: False
temperature: 1.0
top_p: 1.0

### output
output_dir: path/to/result_save/
overwrite_output_dir: true

### eval
per_device_eval_batch_size: 1
predict_with_generate: true
ddp_timeout: 180000000
