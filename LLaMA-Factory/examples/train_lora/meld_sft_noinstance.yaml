### model
model_name_or_path: /home/user_home/huggingface_hub/huggingface_data/Meta-Llama-3.1-8B-Instruct

### method
stage: sft
do_train: true
finetuning_type: lora
# lora_rank: 8
lora_target: all
compute_accuracy: true


### dataset
dataset: meld_train
# dataset_dir: /home/user_home/qiankunjie/project/InitERC/datasets/meld/sft_addlabel_noInstance
template: llama3
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 16
# dataloader_num_workers: 4


### output
output_dir: /home/user_home/qiankunjie/project/InitERC/result_save/meld/
logging_steps: 10
# save_steps: 500
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true
save_only_model: false
